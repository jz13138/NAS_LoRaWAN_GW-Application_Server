# Reachable only from the compose network: 1883 is not published in
# docker-compose.yml, so chirpstack and the two gateway bridges are the only
# clients. An anonymous broker is acceptable on a private bridge network.
listener 1883
allow_anonymous true

# To reach the broker from the LAN or from outside, do not republish 1883.
# Require authentication instead:
#
#   docker run --rm httpd:2.4-alpine htpasswd -nbB chirpstack 'secret' \
#     > configuration/mosquitto/config/mosquitto.passwd
#   chmod 600 configuration/mosquitto/config/mosquitto.passwd
#
# then replace the two active lines above with:
#
#   listener 1883
#   password_file /mosquitto/config/mosquitto.passwd
#   allow_anonymous false
#
# and add the matching credentials to the services:
#   chirpstack            MQTT_USERNAME / MQTT_PASSWORD
#   both gateway bridges  INTEGRATION__MQTT__USERNAME / INTEGRATION__MQTT__PASSWORD
#
# See docs/nginx-integration.md.
