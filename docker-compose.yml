services:
  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
    depends_on:
      - postgres
      - mosquitto
      - redis
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
      # Reverse proxy discovery. An empty VIRTUAL_HOST is ignored by
      # docker-gen, so the stack still starts without a proxy in front.
      - VIRTUAL_HOST=${VIRTUAL_HOST_CHIRPSTACK:-}
      - VIRTUAL_PORT=8080
      - VIRTUAL_PROTO=http
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST_CHIRPSTACK:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    networks:
      - default
      - site1
    # No label here on purpose. docker-gen discovers vhosts from VIRTUAL_HOST
    # alone, while acme-companient identifies the proxy itself by the
    # com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy label and
    # takes the first container carrying it. Put that label on an app container
    # and the companion reloads the wrong container and stops issuing certs.
    # No published port. 8080 is reachable through the reverse proxy only,
    # otherwise it bypasses TLS and stays open on every host interface.

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      # Only needed by gateways on other hosts. The on-host SX1302 forwarder
      # reaches the bridge over the compose network, so this can be removed
      # or bound to a single LAN address when no remote gateway exists.
      - "${SEMTECH_UDP_BIND:-0.0.0.0}:1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto

  chirpstack-gateway-bridge-basicstation:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-eu868.toml
    ports:
      # Unused unless a separate Basic Station node is deployed. See
      # docs/nginx-integration.md before exposing it, the backend is plaintext.
      - "${BASIC_STATION_BIND:-0.0.0.0}:3001:3001"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    depends_on:
      - mosquitto

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST_CHIRPSTACK_REST:-}
      - VIRTUAL_PORT=8090
      - VIRTUAL_PROTO=http
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST_CHIRPSTACK_REST:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    networks:
      - default
      - site1
    depends_on:
      - chirpstack
    # No published port. This API runs --insecure, so nginx basic auth is the
    # only thing standing between it and the internet. Create the password
    # file first, see docs/nginx-integration.md.

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=chirpstack
      - POSTGRES_DB=chirpstack

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./configuration/mosquitto/config/:/mosquitto/config/
    # No published port. Only chirpstack and the two bridges need the broker,
    # and they reach it over the compose network. Publishing 1883 would put an
    # anonymous broker on every host interface.

  sx1302-hal-packet-forwarder:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: sx1302-hal-packet-forwarder:2.1.0
    # The image is built here, it does not exist in any registry. Without this
    # a plain `docker compose up` tries to pull it and fails.
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - chirpstack-gateway-bridge
    environment:
      SX1302_COM_PATH: /dev/ttyACM0
      SX1302_GPS_PATH: /dev/ttyACM1
      SX1302_SERVER_ADDRESS: chirpstack-gateway-bridge
      SX1302_SERV_PORT: "1700"
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
      - "/dev/ttyACM1:/dev/ttyACM1"
    volumes:
      - /sys/class/gpio:/sys/class/gpio

volumes:
  postgresqldata:
  redisdata:

networks:
  # Shared with the nginx-proxy stack so docker-gen can resolve chirpstack and
  # chirpstack-rest-api. Create it once with:
  #   docker network create site1
  # Remove the two `networks:` keys from the services above to run standalone.
  site1:
    external: true
